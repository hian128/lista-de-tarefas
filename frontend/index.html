<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <main class="main">
        <header class="titulo">
            <h1>Lista de Tarefas</h1>
        </header>
        <p id="contador">0 de 0 concluídas</p>
        <input type="text" id="tarefaInput" placeholder="Digite a nova tarefa">
        <button onclick="criarTarefa()">Adicionar</button>

        <div class="filtro">
            <button onclick="filtrarTodas()">Todas</button>
            <button onclick="filtrarPendentes()">Pendentes</button>
            <button onclick="filtrarConcluidas()">Concluídas</button>
        </div>

        <div id="listaTarefas" class="lista-tarefas"></div>


    </main>
    <script src="script.js"></script>
</body>

</html>
